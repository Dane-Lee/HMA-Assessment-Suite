/* ============================================================================
   HMA Overlay — visual language shared with the HMA Corrective Exercise Tracker.

   Adopted from the Tracker verbatim: the ATI red (#cc2200) on near-black chrome,
   Barlow / Barlow Condensed, uppercase condensed headings, the white card with a
   red left rule and an inverted black title bar bled to its edges, the black
   table head with a red leading accent, pill badges, and the body.dark override.

   Two deliberate departures, both because this tool's content differs from the
   Tracker's:

   1. Base type is 18px, not the Tracker's 22px. The Tracker is scored standing
      at a workstation, at arm's length, often gloved. This is a seated analytical
      report with dense tables and multi-paragraph findings; at 22px a single
      finding would not fit on screen. Chrome (header, tabs, buttons, card titles,
      table heads) keeps the Tracker's sizes, so the two still read as one family.

   2. Severity colours reuse the Tracker's existing semantics rather than
      inventing new ones: Priority = its "high" red, Elevated = its "mod" amber,
      clean = its "low" green. Blue (#1565c0) stays reserved for hypermobility and
      orange (#e65100) for OA, exactly as the Tracker uses them, so a colour never
      means two things across the two apps. Monitor takes neutral slate, and
      "not measured" takes a dashed black treatment — an information gap reads as
      unknown, not as a severity.
   ============================================================================ */

/* FONTS-END */

:root{
  --red:#cc2200; --red-dk:#aa1a00; --red-tint:#fff0ee; --red-pale:#fde8e8;
  --ink:#1a1a1a; --ink-dk:#111;
  --page:#f0f0f0; --card:#fff; --line:#e8e8e8; --line-soft:#f0f0f0;
  --tx:#222; --tx2:#555; --tx3:#888;
  --blue:#1565c0; --blue-pale:#e8eeff;
  --green:#2e7d32; --green-dk:#1b5e20; --green-pale:#e8f5e9;
  --amber:#f9a825; --amber-tx:#795548; --amber-pale:#fff3cd; --amber-soft:#fff8e1;
  --orange:#e65100; --orange-tx:#bf360c; --orange-pale:#fff8e8;
  --slate:#546e7a; --slate-pale:#eceff1;
  --shadow:0 4px 16px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  --cond:'Barlow Condensed',Arial Narrow,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',Arial,sans-serif;font-size:18px;background:var(--page);color:var(--tx)}
h1,h2,h3,h4{font-family:var(--cond);text-transform:uppercase;letter-spacing:.5px;line-height:1.2}
h1{font-size:27px;font-weight:800} h2{font-size:23px;font-weight:700}
h3{font-size:21px;font-weight:700} h4{font-size:17px;font-weight:700}
a{color:var(--red);font-weight:600}
code{font:0.92em ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--slate-pale);padding:1px 5px;border-radius:3px}

/* ---------- CHROME ---------- */
.header{background:var(--red);color:#fff;padding:14px 28px;display:flex;align-items:center;
  gap:16px;border-bottom:3px solid #000;flex-wrap:wrap}
.header-logo{background:var(--ink);color:#fff;padding:5px 13px;font-weight:900;font-size:25px;
  letter-spacing:2px;font-family:var(--cond)}
.header h1{font-size:27px;font-weight:800;letter-spacing:.5px;color:#fff}
.header-sub{font-size:18px;color:rgba(255,255,255,.75);margin-left:auto;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;font-family:var(--cond)}
.dark-toggle{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);
  font-family:var(--cond);font-size:16px;padding:5px 13px;border-radius:6px;cursor:pointer;
  text-transform:uppercase;font-weight:700;letter-spacing:.5px}
.dark-toggle:hover{background:rgba(255,255,255,.28)}
.tabs{background:var(--ink-dk);display:flex;border-bottom:3px solid var(--red);
  position:sticky;top:0;z-index:20;overflow-x:auto}
.tab{padding:12px 26px;cursor:pointer;font-size:21px;font-weight:700;color:#777;background:none;
  border:none;border-bottom:3px solid transparent;margin-bottom:-3px;text-transform:uppercase;
  letter-spacing:.5px;transition:all .2s;font-family:var(--cond);white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:var(--red);background:var(--ink)}
.tab:hover:not(.active){color:#ccc;background:#222}
.wrap{padding:26px;max-width:1180px;margin:0 auto}

/* ---------- CARD ---------- */
.card{background:var(--card);border-radius:8px;padding:22px 26px;margin-bottom:20px;
  border-left:4px solid var(--red);box-shadow:var(--shadow)}
.card-title{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#fff;
  background:var(--ink);margin:-22px -26px 22px;padding:11px 20px;border-bottom:2px solid var(--red);
  border-radius:8px 8px 0 0;font-family:var(--cond);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-title .spacer{flex:1}
.card.plain{border-left-color:var(--ink)}

/* ---------- TYPE HELPERS ---------- */
.muted{color:var(--tx2)} .dim{color:var(--tx3)} .small{font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.spacer{flex:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--tx2);margin-top:8px;align-items:center}
.empty{text-align:center;padding:38px 16px;color:var(--tx3)}

/* ---------- BUTTONS ---------- */
button{font-family:var(--cond);font-size:20px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;padding:9px 20px;border:none;border-radius:6px;cursor:pointer;
  transition:all .18s;background:#fff;color:#444;border:1.5px solid #ccc}
button:hover{background:#f5f5f5;border-color:#aaa}
button.primary{background:var(--red);color:#fff;border-color:var(--red)}
button.primary:hover{background:var(--red-dk);border-color:var(--red-dk);box-shadow:0 4px 12px rgba(204,34,0,.3)}
button.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
button.dark:hover{background:#333;border-color:#333}
button.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
button.ghost:hover{background:rgba(0,0,0,.05);border-color:transparent}
button.sm{padding:5px 13px;font-size:17px}
button.xs{padding:3px 10px;font-size:15px}

/* ---------- INPUTS ---------- */
select,input[type=text],textarea{font-family:'Barlow',Arial,sans-serif;font-size:17px;
  border:1.5px solid #d0d0d0;border-radius:6px;padding:8px 11px;background:#fafafa;color:var(--tx);
  max-width:100%;transition:border-color .2s}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--red)}
textarea{width:100%;min-height:150px;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
input.cell{border:none;border-bottom:2px solid #d0d0d0;border-radius:0;background:transparent;
  padding:6px 0;width:100%;font-size:17px}
input.cell:focus{border-bottom-color:var(--red)}
label.fieldlabel{font-family:var(--cond);font-size:16px;font-weight:700;text-transform:uppercase;
  color:var(--tx2);letter-spacing:.5px;display:block;margin-bottom:3px}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:17px}
th{background:var(--ink);color:#fff;padding:11px 15px;text-align:left;font-size:17px;
  text-transform:uppercase;letter-spacing:.5px;font-family:var(--cond);font-weight:700}
th:first-child{border-left:3px solid var(--red)}
td{padding:11px 15px;border-bottom:1px solid #eee;border-left:3px solid transparent}
td:not(:first-child){border-left:none}
tbody tr:nth-child(even) td{background:#f8f8f8}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--red-tint)}
tr.clickable:hover td:first-child{border-left-color:var(--red)}
.table-wrap{overflow-x:auto}

/* ---------- BADGES ---------- */
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:16px;font-weight:700;
  text-transform:uppercase;font-family:var(--cond);letter-spacing:.4px;white-space:nowrap}
.pill.pri{background:var(--red-pale);color:#b71c1c}
.pill.ele{background:var(--amber-pale);color:var(--amber-tx)}
.pill.mon{background:var(--slate-pale);color:var(--slate)}
.pill.ok{background:var(--green-pale);color:var(--green-dk)}
.pill.gapp{background:#e4e4e4;color:#3a3a3a;border:1px dashed #999}
.pill.out{background:transparent;border:1.5px solid #ccc;color:var(--tx2)}
.pill.hyper{background:var(--blue-pale);color:var(--blue)}
.pill.oa{background:var(--orange-pale);color:var(--orange-tx);border:1px solid var(--orange)}

/* ---------- BANNERS (Tracker's summary-strip idiom) ---------- */
.banner{border-radius:6px;padding:11px 18px;margin-bottom:16px;font-size:16px;line-height:1.5;
  border:1px solid;border-left-width:4px}
.banner.warn{background:var(--red-pale);border-color:var(--red);color:#7f1500}
.banner.info{background:var(--blue-pale);border-color:var(--blue);color:#0d3c78}
.banner.good{background:var(--green-pale);border-color:var(--green);color:var(--green-dk)}
.banner.caution{background:var(--orange-pale);border-color:var(--orange);color:var(--orange-tx)}
.banner b{font-weight:700}

/* ---------- SCORE TILES (mirrors the Tracker's score-block) ---------- */
.scorebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.sb{background:#f8f8f8;border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:8px;
  padding:0 0 10px;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow:hidden}
.sb .n{font-family:var(--cond);font-size:16px;font-weight:700;text-transform:uppercase;color:#fff;
  background:var(--ink);padding:5px 8px;text-align:center;line-height:1.3;letter-spacing:.4px}
.sb .v{font-size:26px;font-weight:800;text-align:center;margin-top:8px;font-family:var(--cond)}
.sb .v em{font-style:normal;color:var(--tx3);font-weight:400;font-size:17px}
.sb .foot{text-align:center;font-size:14px;color:var(--tx2);margin-top:4px;padding:0 6px}
.sb.asym{border-top-color:var(--amber)} .sb.asym .n{background:var(--amber);color:#231a05}
.sb.painful{border-top-color:var(--red)} .sb.painful .n{background:var(--red)}
.sb.hyper{border-top-color:var(--blue);background:#f0f4ff} .sb.hyper .n{background:var(--blue)}

/* ---------- TOTAL STRIP ---------- */
.total-display{display:flex;align-items:center;gap:18px;padding:16px 20px;border-radius:8px;
  margin-bottom:16px;border-left:5px solid #ddd;background:#f8f8f8;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.total-display.high{background:var(--red-pale);border-left-color:var(--red)}
.total-display.mod{background:var(--amber-soft);border-left-color:var(--amber)}
.total-display.low{background:var(--green-pale);border-left-color:var(--green)}
.total-num{font-size:46px;font-weight:900;color:var(--ink);min-width:54px;font-family:var(--cond);line-height:1}
.total-label{font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-family:var(--cond)}
.total-sub{font-size:16px;color:var(--tx2);margin-top:2px}

/* ---------- FINDINGS (mirrors the Tracker's ex-category block) ---------- */
.finding{margin-bottom:14px;border-radius:8px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08);
  background:var(--card);border:1px solid #ebebeb}
.fhead{background:var(--ink);color:#fff;padding:10px 16px;font-size:20px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;border-left:5px solid #555;font-family:var(--cond)}
.finding.pri .fhead{border-left-color:var(--red)}
.finding.ele .fhead{border-left-color:var(--amber)}
.finding.mon .fhead{border-left-color:var(--slate)}
.finding.gapf .fhead{border-left-color:#999;border-left-style:dashed}
.ftitle{flex:1;min-width:200px}
.ftitle .arrow{color:#ff8a70;font-weight:700}
.fbody{padding:14px 18px}
.fline{display:grid;grid-template-columns:104px 1fr;gap:4px 14px;font-size:16px;margin:7px 0}
.fline b{font-family:var(--cond);color:var(--tx2);font-weight:700;font-size:15px;text-transform:uppercase;
  letter-spacing:.5px;padding-top:2px}
.why{background:#f8f8f8;border-left:3px solid var(--red);border-radius:0 6px 6px 0;padding:11px 14px;
  margin:11px 0;font-size:16.5px}
.why ul{margin:8px 0 0;padding-left:20px}
.why li{margin:3px 0;font-size:15.5px;color:var(--tx2)}
.acts{margin-top:12px;border-top:1px dashed #ddd;padding-top:10px}
.acts h4{font-family:var(--cond);color:var(--tx3);font-size:15px;text-transform:uppercase;
  letter-spacing:.6px;margin:10px 0 2px}
.acts ul{margin:2px 0 8px;padding-left:20px}
.acts li{font-size:15.5px;margin:3px 0;color:var(--tx2)}
.steps{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.step{background:#f8f8f8;border:1px solid var(--line);border-left:3px solid var(--red);
  border-radius:4px;padding:4px 10px;font-size:15.5px}
details.finding summary{background:var(--ink);color:#fff;padding:10px 16px;font-family:var(--cond);
  font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;
  border-left:5px solid var(--slate)}
details.finding summary:hover{background:#333}
details.finding table{margin:0}

/* ---------- CHIPS / LINKING ---------- */
.linkrow{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eee;flex-wrap:wrap}
.linkrow:last-child{border-bottom:0}
.chip{border:1.5px solid #ddd;background:#fff;border-radius:6px;padding:4px 11px;font-size:15.5px;
  cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--red);color:var(--red);background:var(--red-tint)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.chip.sug{border-color:var(--amber);color:var(--amber-tx);background:var(--amber-soft)}

/* ---------- FREQUENCY PICKER (job editor) ---------- */
.fbtn{font-family:var(--cond);padding:4px 11px;font-size:16px;font-weight:700;text-transform:uppercase;
  border:1.5px solid #ddd;border-radius:6px;background:#fff;color:var(--tx2);letter-spacing:.3px}
.fbtn:hover{border-color:var(--red);color:var(--red);background:var(--red-tint)}
.fbtn.on-never{background:#555;border-color:#555;color:#fff}
.fbtn.on-occ{background:var(--slate);border-color:var(--slate);color:#fff}
.fbtn.on-freq{background:var(--amber);border-color:var(--amber);color:#231a05}
.fbtn.on-const{background:var(--red);border-color:var(--red);color:#fff}
.mvrow td{vertical-align:top;padding:9px 10px}

/* ---------- PRINT ---------- */
.print-only{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  .header,.tabs,.noprint{display:none !important}
  .print-only{display:block}
  .wrap{padding:0;max-width:100%}
  .card,.finding{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #bbb}
  .fhead{background:#1a1a1a !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .card-title,th,.sb .n{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pill{border:1px solid #666;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:14mm}
}

/* ---------- RESPONSIVE ---------- */
@media (max-width:900px){
  body{font-size:17px}
  .wrap{padding:16px}
  .card{padding:18px 16px}
  .card-title{margin:-18px -16px 18px;font-size:20px}
  .tab{padding:11px 16px;font-size:19px}
  .header{padding:12px 16px}
  .header-sub{width:100%;margin-left:0;order:3}
  .fline{grid-template-columns:1fr}
  .fline b{padding-top:6px}
}

/* ============ STORE ============
   The baked SEED_LIBRARY is the floor. S holds employee records plus any local
   edits layered on top of it: S.jobs / S.stations override a seed entry of the
   same id (or add new ones), S.removed hides a seed entry. "Save into program"
   flattens all of that back into the file. */
const LS_KEY = "hmaOverlay.v1";
const blank = () => ({ hma:[], jobs:[], stations:[], removed:[], assign:{}, links:{} });
let S = load();
function load(){
  try { const d = JSON.parse(localStorage.getItem(LS_KEY)); return d && d.hma ? Object.assign(blank(), d) : blank(); }
  catch(e){ return blank(); }
}
function save(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }

function mergeLib(seedArr, localArr){
  const out = (seedArr||[]).filter(x => !S.removed.includes(x.id)).map(x => Object.assign({}, x));
  for (const item of localArr||[]){
    const i = out.findIndex(x => x.id === item.id);
    if (i >= 0) out[i] = item; else out.push(item);
  }
  return out;
}
function allJobs(){ return mergeLib(SEED_LIBRARY.jobs, S.jobs); }
function allStations(){ return mergeLib(SEED_LIBRARY.stations, S.stations); }
function jobById(id){ return allJobs().find(j => j.id === id) || null; }
function stationById(id){ return allStations().find(s => s.id === id) || null; }
function allLinks(){ return Object.assign({}, SEED_LIBRARY.links||{}, S.links); }

/* write a job/station into the local overlay (leaving the baked seed untouched) */
function putJob(job){
  const i = S.jobs.findIndex(j => j.id === job.id);
  if (i >= 0) S.jobs[i] = job; else S.jobs.push(job);
  save();
}
function putStation(st){
  const i = S.stations.findIndex(s => s.id === st.id);
  if (i >= 0) S.stations[i] = st; else S.stations.push(st);
  save();
}

function looksLikeHma(arr){
  return Array.isArray(arr) && arr.length && arr[0] && arr[0].scores && arr[0].hypermobile !== undefined;
}
function ingestHma(arr){
  let added = 0, updated = 0;
  for (const rec of arr){
    if (!rec || !rec.id) continue;
    const i = S.hma.findIndex(x => String(x.id) === String(rec.id));
    if (i >= 0){ S.hma[i] = rec; updated++; } else { S.hma.push(rec); added++; }
  }
  save();
  return { added, updated };
}

   simply there — no paste, no export. Costs nothing to check. */
function trackerSameOrigin(){

/* ============ DEFICIT MODEL (the person) ============ */
function sideDeficit(side){
  if (!side) return null;
  if (side.pain) return 4;
  if (side.val === null || side.val === undefined) return null;
  return 3 - side.val;
}
function profileOf(rec){
  const p = {};
  for (const m of HMA_MOVEMENTS){
    const pair = (rec.scores && rec.scores[m.key]) || [null,null];
    const R = pair[0], L = pair[1];
    const dR = sideDeficit(R), dL = sideDeficit(L);
    const vals = [dR,dL].filter(v => v !== null);
    const rawR = R && !R.pain ? R.val : null, rawL = L && !L.pain ? L.val : null;
    let asym = 0, weakSide = null;
    if (rawR !== null && rawL !== null && rawR !== rawL){
      asym = Math.abs(rawR - rawL);
      weakSide = rawR < rawL ? 0 : 1;
    }
    p[m.key] = {
      key:m.key, label:m.label, sides:m.sides, R, L, rawR, rawL,
      deficit: vals.length ? Math.max(...vals) : null,
      pain: !!((R && R.pain) || (L && L.pain)),
      painSides: [R,L].map((s,i)=> s && s.pain ? m.sides[i] : null).filter(Boolean),
      asym, weakSide,
      weakSideName: weakSide === null ? null : m.sides[weakSide],
      hyper: !!(rec.hypermobile && rec.hypermobile[m.key]),
      quality: (rec.qualityFocus && rec.qualityFocus[m.key]) || [],
      scored: vals.length > 0,
    };
  }
  return p;
}

/* ============ DEMAND MODEL (the job) ============ */
function maxMHForce(job){
  let max = 0, worst = null;
  for (const type of ["lift","carry","pushpull"]){
    for (const row of (job.mh && job.mh[type]) || []){
      const f = parseFloat(row.force);
      if (isNaN(f)) continue;
      if (f > max){ max = f; worst = { type, row }; }
    }
  }
  return { max, worst };
}
const UNILATERAL_RE = /\b(unilateral|one[- ]?sided|one[- ]?hand|single[- ]?hand|right[- ]?hand|left[- ]?hand|right side|left side|dominant)\b/i;
const SUSTAINED_RE  = /\b(sustain|static|hold|prolong|continuous|maintain|constant)\w*\b/i;

/* ============ TASK-STEP LINKING ============ */
function linkKey(jobId, stationId){ return jobId + "|" + stationId; }
function suggestSteps(job, station, mid){
  const kws = STEP_KEYWORDS[mid] || [];
  const mv = (job.movements && job.movements[mid]) || {};
  const pdaText = ((mv.task||"") + " " + (mv.notes||""));
  const out = [];
  station.tasks.forEach((t, idx) => {
    const name = (t.name || "").trim();
    if (!name) return;
    const hay = (name + " " + (t.reduction || "")).toLowerCase();
    const hits = kws.filter(k => hay.includes(k));
    const named = pdaText && name.length > 3 && pdaText.toLowerCase().includes(name.toLowerCase());
    if (hits.length || named) out.push({ idx, name, hits, named });
  });
  return out;
}
function stepsFor(job, station, mid){
  if (!station) return { linked:[], suggested:[] };
  const k = linkKey(job.id, station.id);
  const links = allLinks();
  const saved = (links[k] && links[k][mid]) || null;
  const suggested = suggestSteps(job, station, mid);
  if (saved){
    return { linked: saved.map(i => ({ idx:i, name:(station.tasks[i]||{}).name||"", hazards:(station.tasks[i]||{}).hazards||[] }))
                          .filter(x => x.name), suggested };
  }
  return { linked: suggested.map(s => ({ idx:s.idx, name:s.name, hazards:(station.tasks[s.idx]||{}).hazards||[], auto:true })), suggested };
}
function toggleLink(jobId, stationId, mid, idx){
  const k = linkKey(jobId, stationId);
  const job = jobById(jobId), station = stationById(stationId);
  S.links[k] = S.links[k] || Object.assign({}, (SEED_LIBRARY.links||{})[k] || {});
  if (!S.links[k][mid]) S.links[k][mid] = stepsFor(job, station, mid).linked.map(x=>x.idx);
  const cur = S.links[k][mid];
  const at = cur.indexOf(idx);
  if (at >= 0) cur.splice(at,1); else cur.push(idx);
  cur.sort((a,b)=>a-b);
  save(); render();
}

/* ============ THE ENGINE ============ */
function band(score){ return score >= 8 ? "pri" : score >= 4 ? "ele" : "mon"; }
const BAND_LABEL = { pri:"Priority", ele:"Elevated", mon:"Monitor", gapf:"Not measured" };

function analyze(rec, job, station){
  const prof = profileOf(rec);
  const mh = maxMHForce(job);
  const findings = [];

  for (const pm of PDA_MOVEMENTS){
    const mv = (job.movements && job.movements[pm.id]) || { freq:"", task:"", notes:"" };
    const f = FREQ[mv.freq] || FREQ[""];
    if (!f.w) continue;
    if (HMA_BLIND.includes(pm.id)) continue;

    const text = ((mv.task||"") + " " + (mv.notes||"")).trim();
    const links = stepsFor(job, station, pm.id);

    for (const c of CROSSWALK[pm.id] || []){
      const P = prof[c.hma];
      if (!P || !P.scored || !P.deficit) continue;

      let score = f.w * c.s * P.deficit;
      const mods = [];

      /* Pain overrides scoring, but it still has to land on real exposure. A flat
         floor made "Sitting during breaks and lunch" a Priority finding, which is
         noise. Exposure = frequency weight x coupling: at 1.0 or more the demand is
         genuinely loading the painful pattern (Priority); below that it is a
         contributing load on an incidental demand (Elevated). */
      if (P.pain){
        const exposure = f.w * c.s;
        score = Math.max(score, exposure >= 1 ? 9 : 5);
        mods.push({ t:"pain", text:"Pain was reported on " + P.painSides.join(" and ") +
          " during this movement — this overrides scoring." +
          (exposure >= 1 ? "" : " Exposure here is incidental rather than a core demand, so this ranks below the Priority findings on the same pattern.") });
      }
      if (P.asym >= 1 && c.s >= 0.5){ score += 1;
        mods.push({ t:"asym", text:"Asymmetry: " + P.weakSideName + " scored " + Math.min(P.rawR,P.rawL) +
                  " vs " + Math.max(P.rawR,P.rawL) + " on the other side." +
                  (UNILATERAL_RE.test(text) ? " The job description calls this demand one-sided, so the weaker side likely takes it every cycle." :
                   " Check whether the station layout loads one side preferentially.") }); }
      if (P.hyper && f.w >= 2){ score += 1;
        mods.push({ t:"hyper", text:"Hypermobility was flagged on this pattern. The risk is loss of control at end range under sustained load, not restricted motion — " +
                  f.label.toLowerCase() + " exposure is the concern here." }); }
      if (rec.hasOA && (c.hma === "lunge" || c.hma === "sld")){ score += 2;
        mods.push({ t:"oa", text:"Osteoarthritis is flagged on this record; repeated lower-extremity loading warrants a lower threshold." }); }
      if (mh.max >= 35 && (c.hma === "trunk" || c.hma === "lunge") && f.w >= 2){ score += 1;
        mods.push({ t:"mh", text:"The material-handling chart carries a " + mh.max + " lb " + mh.worst.type +
                  " (" + String(mh.worst.row.freq||"").toLowerCase() + "), which loads this same pattern." }); }
      if (SUSTAINED_RE.test(text) && P.hyper === false && P.deficit >= 2){ score += 0.5;
        mods.push({ t:"sustained", text:"The job description notes this demand is sustained/static rather than intermittent." }); }

      findings.push({
        kind:"match", pdaId:pm.id, pdaName:pm.name, hma:c.hma, hmaLabel:P.label,
        coupling:c.s, freq:f, demandText:text, profile:P, score, mods,
        links, hazards: hazardsFor(links.linked),
        /* pain already floored the score (9 with real exposure, 5 without), so the
           band follows the score rather than overriding it a second time */
        band: band(score),
      });
    }
  }

  findings.sort((a,b)=> b.score - a.score);

  /* OA and material handling apply to every finding on the same pattern; state the
     reason once, on the highest-ranked one, and keep the scoring effect everywhere. */
  const stated = new Set();
  for (const fd of findings){
    fd.mods = fd.mods.filter(m => {
      if (m.t !== "oa" && m.t !== "mh") return true;
      const k = m.t + "|" + fd.hma;
      if (stated.has(k)) return false;
      stated.add(k); return true;
    });
  }

  const blind = [];
  for (const id of HMA_BLIND){
    const mv = (job.movements && job.movements[id]) || {};
    const f = FREQ[mv.freq] || FREQ[""];
    if (f.w >= 2) blind.push({ id, name: PDA_BY_ID[id].name, freq:f, text:((mv.task||"")+" "+(mv.notes||"")).trim() });
  }
  return { prof, findings, blind, mh };
}
function hazardsFor(linked){
  const set = new Set();
  linked.forEach(l => (l.hazards||[]).forEach(h => { if (ERGO_HAZARDS.includes(h)) set.add(h); }));
  return [...set];
}

/* ============ NARRATIVE ============ */
function sideText(P, i){
  const s = i === 0 ? P.R : P.L;
  if (s && s.pain) return "pain";
  const v = i === 0 ? P.rawR : P.rawL;
  return v === null || v === undefined ? "not scored" : String(v);
}
function scoreDesc(P){
  return P.sides[0] + " " + sideText(P,0) + " / " + P.sides[1] + " " + sideText(P,1);
}
function whyText(fd){
  const P = fd.profile;
  return "This job requires " + fd.pdaName.toLowerCase() + " " + fd.freq.label.toLowerCase() +
         " (" + fd.freq.band + " of the shift)" + (fd.coupling < 1 ? ", which partially loads " : ", which loads ") +
         fd.hmaLabel.toLowerCase() + ". On this employee's HMA, " + fd.hmaLabel +
         " came back " + scoreDesc(P) + ".";
}
function correctiveText(P){
  if (P.pain) return ["Do not load this pattern until the pain report is resolved — route to the EIS for re-evaluation before any corrective is assigned."];
  const q = P.quality.map(x => QUALITY_LABELS[x] || x);
  const out = [];
  if (q.length) out.push("Quality focus already selected on the HMA: " + q.join(", ") + " — keep the corrective plan weighted there.");
  else out.push(P.hyper
    ? "No quality focus was recorded. With hypermobility flagged, weight toward static and dynamic stabilization rather than flexibility."
    : "No quality focus was recorded on the HMA. Consider setting one on the next assessment.");
  if (P.asym >= 1) out.push("Bias the corrective volume toward the " + P.weakSideName + " and re-check symmetry at follow-up.");
  return out;
}

/* ============ SAVE INTO PROGRAM ============
   Serializes the live DOM (the inline <script> survives outerHTML), swaps the
   SEED block for the current merged library, and downloads a fresh copy of this
   file. That is what makes the library "part of the program" rather than
   something living in one browser's storage. */
function saveIntoProgram(){
  const lib = { jobs: allJobs(), stations: allStations(), links: allLinks() };
  const payload = JSON.stringify(lib).replace(/</g, "\\u003c");
  const clone = document.documentElement.cloneNode(true);
  const appEl = clone.querySelector("#app");
  if (appEl) appEl.innerHTML = "";          // don't bake the rendered screen
  const bodyEl = clone.querySelector("body");
  if (bodyEl) bodyEl.removeAttribute("class");   // don't bake the current theme
  let html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const re = /\/\* SEED-START \*\/[\s\S]*?\/\* SEED-END \*\//;
  if (!re.test(html)){ alert("Couldn't find the library block in this file — nothing written."); return; }
  html = html.replace(re, "/* SEED-START */\nconst SEED_LIBRARY = " + payload + ";\n/* SEED-END */");
  const blob = new Blob([html], {type:"text/html"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "HMA Overlay.html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  alert("Downloaded a new \"HMA Overlay.html\" with " + lib.jobs.length + " jobs and " +
        lib.stations.length + " stations baked in.\n\nReplace your current file with it. " +
        "From then on the library is part of the program on any machine.");
}

      <button class="sm" style="margin-top:10px" onclick="addTask()">+ task step</button>
    </div>
    <div class="card noprint"><button class="primary" onclick="saveIntoProgram()">Save into program</button>
      <span class="dim small" style="margin-left:10px">Edits are held in this browser until you do.</span></div>`;
}
function editingStation(){
  let s = S.stations.find(x => x.id === currentId);
  if (!s){ s = JSON.parse(JSON.stringify(stationById(currentId))); S.stations.push(s); }
  return s;
}
function setStHead(f,v){ const s = editingStation(); s.head[f] = v; save(); }
function setTask(i,f,v){ const s = editingStation(); s.tasks[i][f] = v; save(); }
function toggleHazard(i,h){
  const s = editingStation();
  const arr = s.tasks[i].hazards = s.tasks[i].hazards || [];
  const at = arr.indexOf(h);
  if (at >= 0) arr.splice(at,1); else arr.push(h);
  save(); render();
}
function addTask(){ const s = editingStation(); s.tasks.push({name:"",hazards:[],reduction:"",actions:[]}); save(); render(); }
function delTask(i){ const s = editingStation(); s.tasks.splice(i,1); save(); render(); }

/* ---------- DATA ---------- */
function renderData(){
  app.innerHTML = `<div class="card"><h1>Employee records</h1>${receiveCard()}</div>
    <div class="card">
      <h3>Records held here <span class="dim" style="font-weight:400">(${S.hma.length})</span></h3>
      ${S.hma.length ? `<table><tbody>${S.hma.map(r=>`<tr>
        <td><b>${esc(r.name||"(unnamed)")}</b><div class="dim small">${esc([r.date,r.dept].filter(Boolean).join(" · "))}</div></td>
        <td style="width:1%"><button class="xs ghost" onclick="dropRec('${esc(r.id)}')">Remove</button></td>
      </tr>`).join("")}</tbody></table>` : `<p class="dim small">None yet.</p>`}
    </div>
    <div class="card">
      <h3>Program library</h3>
      <p class="muted small">${allJobs().length} jobs and ${allStations().length} stations are built into this file.
      ${S.jobs.length||S.stations.length||S.removed.length ? `<b>You have unsaved edits</b> held in this browser —
        use Save into program to write them into the file.` : `No local edits.`}</p>
      <div class="row">
        <button class="primary sm" onclick="saveIntoProgram()">Save into program</button>
        <button class="sm" onclick="revertLib()">Discard local edits</button>
        <button class="sm ghost" onclick="restoreSeed()">Restore built-in library</button>
      </div>
    </div>
    <div class="card"><h3>Clear employee records</h3>
      <p class="muted small">Removes every HMA record from this browser. The job library is untouched.</p>
      <button onclick="wipeRecords()">Clear records</button></div>`;
}
function dropRec(id){
  if (!confirm("Remove this employee's record from the program?")) return;
  S.hma = S.hma.filter(x => String(x.id) !== String(id));
  delete S.assign[id]; save(); render();
}
function wipeRecords(){
  if (!confirm("Clear ALL employee records from this browser?\n\nThe job and station library stays.")) return;
  S.hma = []; S.assign = {}; save(); go("home");
}
function revertLib(){
  if (!confirm("Discard local job/station edits and go back to what's baked into this file?")) return;
  S.jobs = []; S.stations = []; S.removed = []; save(); render();
}
function restoreSeed(){
  if (!confirm("Restore any removed built-in jobs and stations?")) return;
  S.removed = []; save(); render();
}

/* ---------- EMPLOYEE ---------- */
function renderEmployee(){
  const rec = S.hma.find(r => String(r.id) === String(currentId));
  if (!rec){ go("home"); return; }
  const a = S.assign[rec.id] || {};
  const job = jobById(a.jobId);
  const st  = stationById(a.stationId);

  const jobOpts = `<option value="">— select the job —</option>` + allJobs().map(j =>
    `<option value="${esc(j.id)}"${j.id===a.jobId?" selected":""}>${esc(j.info.jobTitle||"(untitled)")}${j.info.site?" — "+esc(j.info.site):""}</option>`).join("");
  const stOpts = `<option value="">— optional: station task steps —</option>` + allStations().map(s =>
    `<option value="${esc(s.id)}"${s.id===a.stationId?" selected":""}>${esc(s.head.workstation||"(untitled)")}</option>`).join("");

  let body = "";
  if (!job) body = `<div class="banner info">Choose the job this employee works to run the overlay.</div>`;
  else body = overlayReport(rec, job, st);

  app.innerHTML = guardBanner() + `
    <div class="card noprint">
      <div class="row">
        <button class="sm ghost" onclick="go('home')">← All employees</button>
        <div class="spacer" style="flex:1"></div>
        ${job ? `<button class="sm" onclick="go('links')">Link task steps</button>
                 <button class="sm primary" onclick="window.print()">Print / Save PDF</button>` : ""}
      </div>
    </div>
    ${personCard(rec)}
    <div class="card noprint">
      <h3>Job assignment</h3>
      <div class="grid2">
        <div><label class="fieldlabel">Job (physical demands)</label><br>
          <select style="width:100%;margin-top:4px" onchange="setAssign('jobId',this.value)">${jobOpts}</select></div>
        <div><label class="fieldlabel">Station (task steps)</label><br>
          <select style="width:100%;margin-top:4px" onchange="setAssign('stationId',this.value)">${stOpts}</select></div>
      </div>
    </div>
    ${body}`;
}
function setAssign(field, val){
  S.assign[currentId] = S.assign[currentId] || {};
  S.assign[currentId][field] = val || null;
  save(); render();
}

function personCard(rec){
  const prof = profileOf(rec);
  const boxes = HMA_MOVEMENTS.map(m => {
    const P = prof[m.key];
    const cls = P.pain ? "painful" : P.hyper ? "hyper" : P.asym >= 1 ? "asym" : "";
    const v = !P.scored ? `<em>not scored</em>`
      : `${P.rawR===null?"—":P.rawR} <span class="dim">/</span> ${P.rawL===null?"—":P.rawL}`;
    const tags = [];
    if (P.pain) tags.push(`<span class="pill pri">pain</span>`);
    if (P.asym >= 1) tags.push(`<span class="pill ele">asym</span>`);
    if (P.hyper) tags.push(`<span class="pill hyper">hyper</span>`);
    return `<div class="sb ${cls}">
      <div class="n">${esc(m.label)}</div><div class="v">${v}</div>
      <div class="foot">R / L${tags.length?"<br>":""}${tags.join(" ")}</div></div>`;
  }).join("");
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <div><h1 style="margin:0">${esc(rec.name||"(unnamed)")}</h1>
        <div class="dim small">${[rec.dept, rec.shift?"Shift "+rec.shift:"", rec.company, rec.location].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="spacer" style="flex:1"></div>
      <div style="text-align:right">
        <div class="dim small">HMA ${esc(rec.date||"")}${rec.type?" · "+esc(rec.type):""}</div>
        <div class="total-num" style="font-size:34px">${rec.total}<span class="dim" style="font-size:17px">/15</span></div></div>
    </div>
    <div class="scorebox">${boxes}</div>
    <div class="legend">
      <span>Scores are R / L, 0–3 per side (0 = unable).</span>
      ${rec.hasOA?`<span><span class="pill oa">OA</span> flagged on this record</span>`:""}
      ${rec.followup?`<span>Follow-up ${esc(rec.followup)}</span>`:""}
      ${rec.retest?`<span>Re-test ${esc(rec.retest)}</span>`:""}
    </div></div>`;
}

function overlayReport(rec, job, station){
  const res = analyze(rec, job, station);
  const counts = { pri:0, ele:0, mon:0 };
  res.findings.forEach(f => counts[f.band]++);

  const head = `<div class="card">
    <h2 style="margin-bottom:2px">${esc(job.info.jobTitle||"(untitled job)")}</h2>
    <div class="dim small">${[job.info.client, job.info.site, job.info.stationScope,
        station && station.head.workstation ? "Station: "+station.head.workstation : ""].filter(Boolean).map(esc).join(" · ")}</div>
    <div class="row" style="margin-top:12px">
      <span class="pill ${counts.pri?"pri":"out"}">${counts.pri} priority</span>
      <span class="pill ${counts.ele?"ele":"out"}">${counts.ele} elevated</span>
      <span class="pill ${counts.mon?"mon":"out"}">${counts.mon} monitor</span>
      ${res.blind.length?`<span class="pill gapp">${res.blind.length} not measured by HMA</span>`:""}
    </div>
    ${!station ? `<p class="small dim noprint" style="margin:12px 0 0">No station selected — findings are reported at the demand level.
      Pick one above to attribute each finding to specific task steps.</p>` : ""}
  </div>`;

  if (!res.findings.length && !res.blind.length){
    return head + `<div class="card empty"><h3>No demand–limitation matches</h3>
      <p class="muted">Every demand rated on this job either falls on a movement pattern this employee scored clean,
      or is rated Never.</p></div>`;
  }

  const cardFor = fd => {
    const P = fd.profile;
    const steps = fd.links.linked;
    const coach = [];
    fd.hazards.forEach(h => (JSA_COACHING[h]||[]).slice(0,3).forEach(x => coach.push(x)));
    if (!coach.length) (JSA_COACHING["Awkward Positioning"]||[]).slice(0,2).forEach(x => coach.push(x));
    return `<div class="finding ${fd.band}">
      <div class="fhead">
        <div class="ftitle">${esc(fd.pdaName)} <span class="arrow">→</span> ${esc(fd.hmaLabel)}</div>
        <span class="pill ${fd.band}">${BAND_LABEL[fd.band]}</span>
      </div>
      <div class="fbody">
      ${steps.length ? `<div class="fline"><b>Task steps</b><div><div class="steps">${
        steps.map(s => `<span class="step">${esc(s.name)}${s.auto?` <span class="dim">· suggested</span>`:""}${
          (s.hazards||[]).filter(h=>ERGO_HAZARDS.includes(h)).map(h=>` <span class="pill out">${esc(h)}</span>`).join("")
        }</span>`).join("")}</div></div></div>` : ""}
      <div class="fline"><b>Demand</b><div>${esc(fd.freq.label)} <span class="dim">(${fd.freq.band} of shift)</span>${
        fd.coupling < 1 ? ` <span class="dim">· contributing load</span>` : ``}${
        fd.demandText ? `<div class="dim small" style="margin-top:3px">${esc(fd.demandText)}</div>` : ``}</div></div>
      <div class="fline"><b>Finding</b><div>${esc(P.label)}: ${esc(scoreDesc(P))}${
        P.pain?` <span class="pill pri">pain</span>`:""}${P.hyper?` <span class="pill out">hypermobile</span>`:""}</div></div>
      <div class="why">${esc(whyText(fd))}${
        fd.mods.length ? `<ul style="margin:7px 0 0;padding-left:18px">${fd.mods.map(m=>`<li>${esc(m.text)}</li>`).join("")}</ul>` : ""}</div>
      <div class="acts">
        <h4>Corrective focus</h4><ul>${correctiveText(P).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Coaching at the station</h4><ul>${coach.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <h4>Station / engineering</h4><ul>${(STATION_FIX[fd.pdaId]||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      </div></div></div>`;
  };

  const top = res.findings.filter(f => f.band !== "mon");
  const low = res.findings.filter(f => f.band === "mon");
  const cards = top.map(cardFor).join("")
    + (low.length ? `<details class="finding mon" ${top.length ? "" : "open"}>
        <summary>Monitor — ${low.length} lower-ranked match${low.length===1?"":"es"}</summary>
        <div class="table-wrap"><table><thead><tr><th>Demand</th><th>Pattern</th><th>Frequency</th><th>Task steps</th></tr></thead>
        <tbody>${low.map(f=>`<tr><td>${esc(f.pdaName)}</td><td>${esc(f.hmaLabel)}</td>
          <td class="dim">${esc(f.freq.label)}</td>
          <td class="dim small">${f.links.linked.map(s=>esc(s.name)).join(", ") || "—"}</td></tr>`).join("")}
        </tbody></table></div></details>` : "");

  const blindCard = res.blind.length ? `<div class="finding gapf">
    <div class="fhead"><div class="ftitle">Demands the HMA does not measure</div><span class="pill gapp">Not measured</span></div>
    <div class="fbody">
    <p class="small muted" style="margin:0 0 8px">The Human Movement Assessment scores five patterns, none of which cover the hand and wrist.
    These demands are significant on this job but this employee has no capability data against them — treat as unknown, not as low risk.</p>
    <div class="steps">${res.blind.map(b=>`<span class="step">${esc(b.name)} <span class="dim">· ${esc(b.freq.label)}</span></span>`).join("")}</div>
    <div class="acts"><h4>Suggested next step</h4><ul>
      <li>Screen these with the WISHA Hand &amp; Wrist zone in the Ergo Assessment Helper, or a Strain Index analysis in the Task Analysis Scores tool.</li>
    </ul></div></div></div>` : "";

  const mhNote = res.mh.max ? `<div class="card small muted">
    <b>Material handling on this job:</b> heaviest recorded is ${res.mh.max} lb
    (${esc(res.mh.worst.type)}, ${esc(res.mh.worst.row.freq||"unrated")}${res.mh.worst.row.item?", "+esc(res.mh.worst.row.item):""}).
    ${res.mh.max >= 35 ? "This is factored into the trunk and lower-extremity findings above." : ""}</div>` : "";

  return head + `<div class="print-only" style="margin-bottom:10px">
      <b>${esc(rec.name||"")}</b> · ${esc(job.info.jobTitle||"")} · generated ${new Date().toISOString().slice(0,10)}
    </div>` + cards + blindCard + mhNote + `
    <div class="card small dim">
      Ranking is <b>demand × pattern coupling × measured deficit</b>, escalated by pain, side-to-side asymmetry,
      hypermobility under sustained load, OA, and material-handling force. See
      <a href="#" class="noprint" onclick="go('method');return false">Method</a> for the full crosswalk and thresholds.
      Findings are a prioritization aid for the EIS, not a clinical or employment determination.
    </div>`;
}

function renderLinks(){
  const rec = S.hma.find(r => String(r.id) === String(currentId));
  const a = (rec && S.assign[rec.id]) || {};
  const job = jobById(a.jobId), station = stationById(a.stationId);
  if (!rec || !job){ go("home"); return; }
  if (!station){
    app.innerHTML = `<div class="card"><button class="sm ghost" onclick="go('emp')">← Back</button>
      <div class="banner info" style="margin-top:14px">Select a station on the employee screen first —
      task-step linking needs its task list.</div></div>`;
    return;
  }
  const rows = PDA_MOVEMENTS.filter(m => {
    const f = FREQ[((job.movements||{})[m.id]||{}).freq] || FREQ[""];
    return f.w > 0;
  }).map(m => {
    const stp = stepsFor(job, station, m.id);
    const on = new Set(stp.linked.map(x=>x.idx));
    const sug = new Set(stp.suggested.map(x=>x.idx));
    const chips = station.tasks.map((t,idx) => {
      if (!(t.name||"").trim()) return "";
      const cls = on.has(idx) ? "chip on" : sug.has(idx) ? "chip sug" : "chip";
      return `<span class="${cls}" onclick="toggleLink('${esc(job.id)}','${esc(station.id)}','${m.id}',${idx})">${esc(t.name)}</span>`;
    }).join("");
    return `<div class="linkrow">
      <div style="min-width:170px"><b>${esc(m.name)}</b>
        <div class="dim small">${esc((FREQ[((job.movements||{})[m.id]||{}).freq]||FREQ[""]).label)}</div></div>
      <div style="flex:1;display:flex;gap:6px;flex-wrap:wrap">${chips || `<span class="dim small">No named task steps.</span>`}</div>
    </div>`;
  }).join("");
  app.innerHTML = `<div class="card">
      <button class="sm ghost" onclick="go('emp')">← Back to ${esc(rec.name||"employee")}</button>
      <h1 style="margin-top:14px">Link task steps to demands</h1>
      <p class="muted small">Which steps of <b>${esc(station.head.workstation||"this station")}</b> involve each demand from
      <b>${esc(job.info.jobTitle||"this job")}</b>? Orange chips are keyword suggestions — click to confirm or clear.
      Once you touch a row it's yours and suggestions stop overriding it. This mapping is shared by every employee
      on this job + station pair, and is baked in by <b>Save into program</b>.</p>
      <div class="legend"><span><span class="chip on" style="cursor:default">linked</span></span>
        <span><span class="chip sug" style="cursor:default">suggested</span></span>
        <span><span class="chip" style="cursor:default">not linked</span></span></div>
    </div>
    <div class="card">${rows || `<p class="dim">No demands rated above Never on this job.</p>`}</div>`;
}

function renderMethod(){
  const rows = PDA_MOVEMENTS.map(m => {
    const cw = CROSSWALK[m.id] || [];
    const cells = cw.length
      ? cw.map(c => `${esc(HMA_BY_KEY[c.hma].label)} <span class="dim">(${c.s === 1 ? "primary" : c.s + "×"})</span>`).join("<br>")
      : `<span class="pill gapp">not measured by HMA</span>`;
    return `<tr><td><b>${esc(m.name)}</b></td><td>${cells}</td><td class="dim small">${(STEP_KEYWORDS[m.id]||[]).slice(0,5).join(", ")}</td></tr>`;
  }).join("");
  app.innerHTML = `<div class="card"><h1>Method</h1>
      <p class="muted">Everything the ranking does, stated plainly. No part of it is a black box.</p></div>
    <div class="card">
      <h2>1. The person — deficit from the HMA</h2>
      <table><thead><tr><th>HMA score (per side)</th><th>Deficit</th></tr></thead><tbody>
        <tr><td>Pain reported</td><td><b>4</b> — overrides scoring, forces Priority</td></tr>
        <tr><td>0 (unable)</td><td><b>3</b></td></tr><tr><td>1</td><td><b>2</b></td></tr>
        <tr><td>2</td><td><b>1</b></td></tr><tr><td>3 (clean)</td><td><b>0</b> — produces no finding</td></tr>
      </tbody></table>
      <p class="small muted">A pattern's deficit is its <b>worst side</b>, because the job loads the worst side too.
      The Tracker's 15-point total uses <code>min(R,L)</code> summed across five patterns — useful for triage,
      but it hides which side is limited, which is exactly what matters here.</p>
    </div>
    <div class="card">
      <h2>2. The job — demand from the FTA / PDA</h2>
      <table><thead><tr><th>Frequency</th><th>Share of shift</th><th>Weight</th></tr></thead><tbody>
        <tr><td>Never</td><td>0%</td><td>0 — excluded</td></tr>
        <tr><td>Occasional</td><td>11–33%</td><td>1</td></tr>
        <tr><td>Frequent</td><td>34–66%</td><td>2</td></tr>
        <tr><td>Constant</td><td>67%+</td><td>3</td></tr></tbody></table>
      <p class="small muted">The built-in jobs came from 2020-era ATI FTAs on the older five-level scale
      (Never / Minimal / Occasional / Frequent / Constant). <b>Minimal</b> maps to Occasional, the lowest non-zero
      band on the current scale. Where an FTA's summary grid and its detail rows disagreed, the
      <b>higher</b> demand was kept and the conflict is flagged on that job's edit screen.</p>
    </div>
    <div class="card">
      <h2>3. The crosswalk</h2>
      <p class="muted small">Which movement pattern each of the 17 demands loads, and the keywords used to
      suggest matching task steps.</p>
      <table><thead><tr><th>Job demand</th><th>Loads</th><th>Step keywords</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="card">
      <h2>4. Ranking</h2>
      <p><code>score = frequency weight × coupling strength × deficit</code>, then escalated:</p>
      <ul class="muted small">
        <li><b>Pain</b> on the pattern → floor of 9 (Priority), regardless of everything else.</li>
        <li><b>Asymmetry</b> ≥ 1 point between sides → +1, with a note naming the weaker side.</li>
        <li><b>Hypermobility</b> flagged and demand is Frequent or Constant → +1.</li>
        <li><b>OA</b> flagged and the pattern is Forward Lunge or Single Leg Dip → +2.</li>
        <li><b>Material handling</b> ≥ 35 lb and the pattern is Trunk Rotation or Forward Lunge at Frequent+ → +1.</li>
        <li><b>Sustained/static</b> language in the job notes with a deficit of 2+ → +0.5.</li>
      </ul>
      <p class="row" style="gap:8px"><span class="pill pri">Priority ≥ 8</span>
        <span class="pill ele">Elevated 4–7</span><span class="pill mon">Monitor &lt; 4</span></p>
    </div>
    <div class="card">
      <h2>5. Known gap</h2>
      <p class="muted">The HMA scores five patterns — none measure the hand or wrist. Simple Grasp, Firm Grasp,
      Fine Manipulation, and Pinching therefore have no capability data to join against. When a job rates them
      Frequent or Constant they are reported as <b>not measured</b> rather than folded into the ranking, so the
      absence of a finding is never mistaken for absence of risk.</p>
    </div>
    <div class="card">
      <h2>6. Scope limits</h2>
      <ul class="muted">
        <li>A <b>prioritization aid</b>: which correctives to weight, which coaching to reinforce, which station change to pursue first.</li>
        <li><b>Not</b> a fitness-for-duty determination, work restriction, placement input, or medical opinion.</li>
        <li>Admin-facing only. Nothing here is surfaced to the employee.</li>
        <li>Runs entirely in this browser. No network calls, no cloud storage, no AI platform.</li>
      </ul>
    </div>`;
}

/* ============ THEME ============ */
/* Same convention as the Tracker: light by default, body.dark opts in. */
function toggleTheme(){
  document.body.classList.toggle("dark");
  try { localStorage.setItem("hmaOverlay.theme", document.body.classList.contains("dark") ? "dark" : "light"); } catch(e){}
  render();
}
try { if (localStorage.getItem("hmaOverlay.theme") === "dark") document.body.classList.add("dark"); } catch(e){}

render();
</script>
</body>
</html>
